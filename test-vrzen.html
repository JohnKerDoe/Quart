<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test VRZen</title>
<style>
:root{--paper:#E9EEF0;--ink:#16303F;--muted:#5E7482;--ok:#1F8A5B;--ko:#C8363A;--line:#C9D4DA}
@media (prefers-color-scheme:dark){:root{--paper:#0E1A22;--ink:#E3ECF0;--muted:#8FA3AF;--ok:#3FC08A;--ko:#F0666A;--line:#25394A}}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 4px}
p{color:var(--muted);margin:0 0 14px}
input{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:transparent;color:inherit}
button{margin-top:10px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font:600 16px system-ui;cursor:pointer}
.res{border-bottom:1px solid var(--line);padding:12px 0;word-break:break-all}
.res b{display:block;font-size:17px}
.ok{color:var(--ok)}.ko{color:var(--ko)}
pre{white-space:pre-wrap;font-size:12px;color:var(--muted);max-height:160px;overflow:auto;margin:6px 0 0}
</style>
</head>
<body>
<main>
  <h1>Test d'accès à VRZen</h1>
  <p>Cette page essaie de lire VRZen depuis GitHub Pages, comme le ferait Quart.</p>
  <input id="url" value="https://routage.vrzen.org/" aria-label="Adresse à tester">
  <button id="go">Lancer le test</button>
  <div id="out"></div>
</main>
<script>
const out = document.getElementById('out');
async function test(url){
  const div = document.createElement('div'); div.className = 'res';
  div.innerHTML = `<b>Test en cours…</b>${url}`; out.prepend(div);
  try{
    const res = await fetch(url, { mode: 'cors', cache: 'no-store' });
    const text = await res.text();
    div.innerHTML = `<b class="ok">Accès autorisé (code ${res.status})</b>${url}<pre>${text.slice(0, 600).replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;')}</pre>`;
  }catch(err){
    div.innerHTML = `<b class="ko">Accès bloqué</b>${url}<p style="margin:6px 0 0">Le site n'autorise pas les autres pages à lire ses données (CORS), ou il est injoignable.</p>`;
  }
}
document.getElementById('go').addEventListener('click', () => {
  const url = document.getElementById('url').value.trim();
  if(url) test(url);
});
</script>
</body>
</html>
